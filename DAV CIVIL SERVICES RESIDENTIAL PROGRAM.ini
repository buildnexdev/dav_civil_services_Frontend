# MASTER DEVELOPMENT PROMPT
## DAV CIVIL SERVICES RESIDENTIAL PROGRAM — COMPLETE WEBSITE + MANAGEMENT SYSTEM

You are a senior UI/UX designer, frontend engineer, backend engineer, database architect, and full-stack developer.

Build a COMPLETE, PRODUCTION-READY, RESPONSIVE web application for:

**DAV CIVIL SERVICES RESIDENTIAL PROGRAM**

The system must contain:

1. Public Website
2. Admin Panel
3. Student Portal
4. Staff/Faculty Portal
5. Admissions System
6. Scholarship Management
7. Academic Management
8. Alumni Management
9. Performance Analytics
10. Notifications
11. Reports
12. Gallery / Media
13. Payment-ready architecture
14. Role-based authentication

Do NOT create a simple template or only a landing page.

Build the entire application flow with professional UI, realistic sample data, working navigation, forms, tables, dashboards, filters, charts, authentication screens, and responsive layouts.

---

# 1. DESIGN DIRECTION

Create a:

**LIGHT THEME + COLORFUL + PREMIUM EDUCATIONAL WEBSITE**

The design should feel like a combination of:

- Premium civil-services institute
- Government/educational institution
- Modern SaaS dashboard
- Professional academic portal

Do NOT make the design dark.

Primary theme:

- White background
- Navy / deep blue
- Royal blue
- Sky blue
- Orange/gold accent
- Green for success
- Red for alerts
- Soft gray backgrounds

Use colors consistently.

The website should have:

- Large typography
- Clean spacing
- Rounded cards
- Subtle shadows
- Modern icons
- Beautiful statistics
- Professional charts
- Attractive section separators
- Smooth hover effects
- Micro animations
- Responsive layouts

Avoid:

- Excessive gradients
- Overly flashy animations
- Clutter
- Huge unnecessary borders
- Dark dashboards
- Generic bootstrap-looking UI

The result should look like a premium institutional website.

